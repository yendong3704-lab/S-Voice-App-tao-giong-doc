<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem("color-scheme");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = storedScheme ?? "light dark";
        const isDark =
          storedScheme === "dark" ||
          (!storedScheme &&
            (!window.matchMedia ||
              window.matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {}
    </script>
    <title>S-voice – Phòng thu Giọng đọc AI &amp; Biên tập Kịch bản Đa ngôn ngữ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#0f172a] dark:text-[#f8fafc] font-sans antialiased selection:bg-[#6366f1]/30 selection:text-[#d97706] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
